name: Build for iOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest                    # ★ 关键：必须用 macOS
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Compile for iOS
        run: |
          # macOS 自带 iOS SDK，CGO_ENABLED=1 可以正常链接
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 \
          go build -ldflags="-s -w -X main.version=${GITHUB_REF#refs/tags/}" \
          -o ddns-go_ios_arm64 .

      - name: Compress
        run: tar -czvf ddns-go_ios_arm64.tar.gz ddns-go_ios_arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddns-go-ios
          path: ddns-go_ios_arm64.tar.gz

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ddns-go_ios_arm64.tar.gz
          generate_release_notes: true
