name: Build for iOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Compile for iOS (with min version <= 15.0)
        run: |
          # 获取 iOS SDK 路径和编译器
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos --find clang)
          CXX=$(xcrun --sdk iphoneos --find clang++)
          
          # 强制指定最低 iOS 版本为 12.0（低于 15.0，保证兼容）
          export IPHONEOS_DEPLOYMENT_TARGET=12.0
          
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC=$CC CXX=$CXX SDKROOT=$SDKROOT \
          CGO_CFLAGS="-miphoneos-version-min=12.0" \
          go build -ldflags="-s -w -X main.version=${GITHUB_REF#refs/tags/}" \
          -o ddns-go_ios_arm64 .

      - name: Compress
        run: tar -czvf ddns-go_ios_arm64.tar.gz ddns-go_ios_arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddns-go-ios
          path: ddns-go_ios_arm64.tar.gz

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ddns-go_ios_arm64.tar.gz
          generate_release_notes: true
