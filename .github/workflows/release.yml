name: Build for iOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # 编译命令：强制纯 Go，禁止任何 cgo 链接
      - name: Compile for iOS
        run: |
          CGO_ENABLED=0 GOOS=ios GOARCH=arm64 \
          go build -tags netgo,osusergo \
            -ldflags="-s -w -extldflags '-static' -X main.version=${GITHUB_REF#refs/tags/}" \
            -o ddns-go_ios_arm64 .

      - name: Compress
        run: tar -czvf ddns-go_ios_arm64.tar.gz ddns-go_ios_arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddns-go-ios
          path: ddns-go_ios_arm64.tar.gz

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ddns-go_ios_arm64.tar.gz
          generate_release_notes: true
